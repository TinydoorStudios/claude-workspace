<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDS · VM Rack</title>
<style>
:root{
  --bg:#06080c; --panel:#0b0f16; --panel2:#0e141d; --inset:#090d13;
  --edge:#1b2433; --edge2:#233044;
  --ink:#d7e2f0; --mut:#69788f; --dim:#42506a;
  --cy:#37c8ff; --cy-dim:#1a5f7d; --ok:#2fe6a0; --warn:#ffd24d; --hot:#ff9440; --bad:#ff4d57;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--mono); color:var(--ink); min-height:100vh; background:var(--bg);
  background-image:
    radial-gradient(1000px 550px at 50% -12%, rgba(55,200,255,.08), transparent 60%),
    linear-gradient(rgba(55,200,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(55,200,255,.022) 1px, transparent 1px);
  background-size:100% 100%, 44px 44px, 44px 44px;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);opacity:.55}
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 56px;position:relative;z-index:1}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border:1px solid var(--edge);background:linear-gradient(180deg,#0d1420,#0a0e15);
  border-radius:4px;padding:10px 16px;margin-bottom:14px}
.brand{font-size:15px;font-weight:700;letter-spacing:2px;color:#fff}
.brand b{color:var(--cy)}
.brand a{color:var(--dim);text-decoration:none;font-size:10px;letter-spacing:1px;margin-left:12px}
.brand a:hover{color:var(--cy)}
.top .sp{flex:1}
.link{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.link .led{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.link.up{color:var(--ok)} .link.up .led{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.link.dn{color:var(--bad)} .link.dn .led{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.clock{font-size:15px;color:#fff;font-weight:600;letter-spacing:1px}
.clock small{color:var(--dim);font-size:10px;letter-spacing:2px;margin-left:6px}
@keyframes blink{50%{opacity:0}}

.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--edge);border-radius:4px;padding:16px 18px;margin-bottom:14px}
.panel::before,.panel::after,
.panel .ck::before,.panel .ck::after{content:'';position:absolute;width:14px;height:14px;
  border-color:var(--cy-dim);border-style:solid;border-width:0}
.panel::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.panel::after{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
.panel .ck::before{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
.panel .ck::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.plabel{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:2.5px;
  color:var(--cy);margin-bottom:14px;text-transform:uppercase}
.plabel::before{content:'▮';font-size:9px}
.plabel .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
.plabel .note{color:var(--dim);letter-spacing:1px;font-size:10px;text-transform:none}

.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.node{background:var(--inset);border:1px solid var(--edge);border-radius:3px;padding:12px 14px}
.node.wide{grid-column:1 / -1}
.nhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nhead .led{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);flex:none}
.nhead .led.off{background:var(--bad);box-shadow:0 0 7px var(--bad)}
.nhead .led.unk{background:var(--dim);box-shadow:none}
.nhead .nm{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#fff}
.nhead .role{font-size:9px;color:var(--dim);letter-spacing:1px;margin-left:auto;text-transform:uppercase;text-align:right}
.meter{margin:7px 0}
.meter .ml{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:var(--mut);margin-bottom:3px}
.meter .ml b{color:var(--ink)}
.bar{height:5px;background:#121926;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy-dim),var(--cy));border-radius:2px;
  box-shadow:0 0 8px rgba(55,200,255,.4)}
.bar i.w{background:linear-gradient(90deg,#7d5f1a,var(--warn));box-shadow:0 0 8px rgba(255,210,77,.4)}
.bar i.b{background:linear-gradient(90deg,#7d2a26,var(--bad));box-shadow:0 0 8px rgba(255,77,87,.4)}
.nfoot{font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:8px;text-transform:uppercase}
.nfoot b{color:var(--mut)}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:10px}
.svcchip{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.8px;color:var(--mut);padding:3px 0}
.svcchip .led{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 5px var(--ok);flex:none}
.svcchip .led.off{background:var(--bad);box-shadow:0 0 5px var(--bad)}
.svcchip b{color:var(--ink);font-weight:600}
.svcchip .ut{margin-left:auto;color:var(--dim);font-size:8.5px}
.shows{width:100%;border-collapse:collapse;font-size:11px}
.shows td{padding:7px 8px;border-top:1px solid var(--edge);vertical-align:middle}
.shows tr:first-child td{border-top:0}
.shows tr.past{opacity:.4}
.shows tr.day td{border-top:1px solid var(--edge2)}
.shows .dt{color:#fff;font-weight:700;letter-spacing:1px;white-space:nowrap;width:1%}
.shows .dt small{display:block;color:var(--dim);font-size:9px;font-weight:400;letter-spacing:1.5px}
.shows .vn{width:1%;white-space:nowrap}
.tag{display:inline-block;font-size:9px;letter-spacing:1.5px;padding:2px 6px;border:1px solid var(--edge2);border-radius:2px;color:var(--mut)}
.tag.MEMO{color:#c9a6ff;border-color:#4a3a6b} .tag.FSQ{color:var(--cy);border-color:var(--cy-dim)} .tag.WP{color:var(--ok);border-color:#1d5a44}
.shows .nm{color:var(--ink)} .shows .nm a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)}
.shows .nm a:hover{color:var(--cy)}
.pips{display:flex;gap:4px;white-space:nowrap;width:1%}
.pip{font-size:8.5px;letter-spacing:1px;padding:2px 5px;border-radius:2px;background:#121926;color:var(--dim)}
.pip.on{background:rgba(47,230,160,.12);color:var(--ok)}
.pip.na{background:none;color:#2a3446}
.shows .fl{width:1%;white-space:nowrap;text-align:right;font-size:9px;letter-spacing:1px}
.fl .w{color:var(--warn)} .fl .b{color:var(--bad)} .fl .o{color:var(--ok)}
@media (max-width:640px){.shows .pl{display:none}.pip{padding:2px 3px}}
.adv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}
@media (max-width:860px){.adv{grid-template-columns:1fr}}
.sub{font-size:9px;letter-spacing:2px;color:var(--mut);margin-bottom:8px;text-transform:uppercase}
.need{display:block;background:var(--inset);border:1px solid var(--edge);border-left:2px solid var(--warn);
  border-radius:3px;padding:8px 10px;margin-bottom:6px;text-decoration:none;color:var(--ink)}
.need:hover{border-color:var(--edge2);border-left-color:var(--warn);background:#0c121b}
.need b{display:block;font-size:10.5px;color:var(--warn);letter-spacing:.8px;margin-bottom:3px}
.need span{font-size:10px;color:var(--mut)}
.need.none{border-left-color:var(--ok)} .need.none b{color:var(--ok)}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.st{display:inline-block;font-size:8.5px;letter-spacing:1px;padding:2px 6px;border-radius:2px;white-space:nowrap;text-transform:uppercase}
.st.finalized{background:rgba(47,230,160,.12);color:var(--ok)}
.st.responded{background:rgba(201,166,255,.12);color:#c9a6ff}
.st.ready,.st.followup{background:rgba(55,200,255,.10);color:var(--cy)}
.st.due,.st.held{background:rgba(255,210,77,.12);color:var(--warn)}
.st.cancelled{background:rgba(255,77,87,.10);color:var(--bad)}
.st.queued{background:#121926;color:var(--dim)}
.bills td{padding:6px 8px}
.bills .act{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:2px 0}
.bills .act span:first-child{color:var(--ink)}
.bills .ser{color:var(--dim);font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.bills .rv{color:var(--warn);font-size:9px;letter-spacing:1px}
.iss{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.iss{grid-template-columns:1fr}}
.tk{display:flex;gap:10px;align-items:flex-start;background:var(--inset);border:1px solid var(--edge);
  border-left:2px solid var(--dim);border-radius:3px;padding:7px 10px;margin-bottom:5px;text-decoration:none;color:var(--ink);font-size:10.5px}
.tk:hover{background:#0c121b}
.tk.s1{border-left-color:var(--bad)} .tk.s2{border-left-color:var(--hot)} .tk.s3{border-left-color:var(--warn)}
.tk .id{color:var(--dim);font-size:9px;letter-spacing:1px;white-space:nowrap;padding-top:1px}
.tk .bd{flex:1;min-width:0} .tk .bd small{display:block;color:var(--mut);font-size:9px;letter-spacing:.8px;margin-top:2px;text-transform:uppercase}
.tk .ag{color:var(--dim);font-size:9px;white-space:nowrap}
.tk.none{border-left-color:var(--ok)}
.pd{font-size:10.5px;color:var(--ink);padding:6px 0;border-top:1px solid var(--edge)}
.pd:first-of-type{border-top:0}
.pd b{font-size:8.5px;letter-spacing:1px;color:var(--cy);font-weight:400;text-transform:uppercase;margin-right:6px}
.pd.rc b{color:#c9a6ff}
.pdsec{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:8px 0 2px}
.hint{font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:8px}
.foot{color:var(--dim);font-size:10px;letter-spacing:2px;margin-top:26px;text-align:center;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <span class="brand">TDS <b>VM RACK</b><a href="/">← CONSOLE</a></span>
  <span class="sp"></span>
  <span class="link" id="lnkSts"><span class="led"></span><span id="lnkStsTxt">STATUS FEED</span></span>
  <span class="clock"><span id="clk">--:--:--</span><small id="dte"></small></span>
</div>

<div class="panel">
  <span class="ck"></span>
  <div class="plabel">SHOWS · NEXT 3 WEEKS<span class="rule"></span><span class="note" id="shNote">loading…</span></div>
  <table class="shows" id="shows"></table>
</div>

<div class="panel">
  <span class="ck"></span>
  <div class="plabel">BAND ADVANCE<span class="rule"></span><span class="note" id="advNote">loading…</span></div>
  <div class="adv">
    <div><div class="sub">Needs you</div><div id="advNeeds"></div></div>
    <div><div class="sub">Bills · today forward</div><div class="tally" id="advTally"></div><table class="shows bills" id="advBills"></table></div>
  </div>
</div>

<div class="panel">
  <span class="ck"></span>
  <div class="plabel">OPEN ISSUES<span class="rule"></span><span class="note" id="issNote"></span></div>
  <div class="iss">
    <div><div class="sub" id="tkHead">Gear tickets</div><div id="tkList"><div class="hint">loading…</div></div></div>
    <div><div class="sub" id="pdHead">KB write-backs · PENDING.md</div><div id="pdList"><div class="hint">loading…</div></div></div>
  </div>
</div>

<div class="panel">
  <span class="ck"></span>
  <div class="plabel">RACK<span class="rule"></span><span class="note" id="stsNote">connecting…</span></div>
  <div class="rack" id="rack"><div class="node"><div class="nhead"><span class="led unk"></span><span class="nm">LOADING…</span></div></div></div>
</div>

<div class="foot">systems defined in /opt/status-writer/rack.json on the n8n VM · nyquist</div>
</div>

<script>
function tick(){
  const now = new Date();
  document.getElementById('clk').textContent =
    now.toLocaleTimeString('en-US',{hour12:false,timeZone:'America/New_York'});
  document.getElementById('dte').textContent =
    now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'}).toUpperCase();
}
tick(); setInterval(tick, 1000);

function meter(label, pct, valTxt){
  const cls = pct >= 92 ? 'b' : pct >= 85 ? 'w' : '';
  return '<div class="meter"><div class="ml"><span>'+label+'</span><b>'+(valTxt || pct.toFixed(0)+'%')+'</b></div>'+
    '<div class="bar"><i class="'+cls+'" style="width:'+Math.min(pct,100)+'%"></i></div></div>';
}
function fmtUp(sec){
  if (sec == null) return '—';
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600);
  return d > 0 ? d + 'D ' + h + 'H' : h + 'H ' + Math.floor(sec%3600/60) + 'M';
}
function dockerUt(status){
  const m = /Up (?:About )?(\d+)?\s*(\w+)/.exec(status || '');
  if (!m) return '';
  return 'dckr·' + (m[1] || '1') + m[2][0];
}
function chip(name, ok, ut){
  return '<span class="svcchip"><span class="led'+(ok ? '' : ' off')+'"></span><b>'+name+'</b>'+
    '<span class="ut">'+(ut || '')+'</span></span>';
}
function led(state){ // true | false | null
  return '<span class="led' + (state === true ? '' : state === false ? ' off' : ' unk') + '"></span>';
}

function render(S){
  renderTickets(S.tickets);
  const note = document.getElementById('stsNote');
  const age = Math.round(Date.now()/1000 - (S.generated || 0));
  note.textContent = 'LIVE · UPDATED ' + (age < 90 ? age + 'S AGO' : 'STALE — ' + fmtUp(age) + ' OLD');
  const lnk = document.getElementById('lnkSts');
  lnk.className = 'link ' + (age < 180 ? 'up' : 'dn');

  const guests = S.guests || [];
  const byVmid = {};
  guests.forEach(g => byVmid[g.vmid] = g);
  const cards = [];

  // ── PVE host ──
  const pve = S.pve;
  cards.push('<div class="node">'+
    '<div class="nhead">'+led(pve ? pve.status === 'online' : null)+
    '<span class="nm">PVE · TDS HOST</span><span class="role">Dell 14G · Proxmox 9</span></div>'+
    (pve
      ? meter('CPU', pve.cpu*100) + meter('MEM', pve.mem*100) +
        '<div class="nfoot">ONLINE · UP '+fmtUp(pve.uptime)+' · '+guests.length+' GUESTS</div>'
      : '<div class="nfoot">HOST TELEMETRY OFFLINE — PUSH CRON NOT INSTALLED ON TDS (SEE DEPLOY.MD)</div>')+
    '</div>');

  // ── self (n8n VM) — full local detail ──
  const vm = S.vm || {};
  const chips = [];
  Object.entries(S.services || {}).forEach(([k, st]) =>
    chips.push(chip(k.replace('tempest-dashboard','tempest-dash'), st === 'active', 'sysd')));
  (S.docker || []).forEach(c =>
    chips.push(chip(c.name.replace('n8n-n8n-1','n8n').replace('n8n-postgres-1','postgres'),
                    /^Up/.test(c.status), dockerUt(c.status))));
  const g100 = byVmid[100];
  cards.push('<div class="node wide">'+
    '<div class="nhead">'+led(true)+'<span class="nm">VM 100 · N8N</span>'+
    '<span class="role">Debian 12 · 192.168.200.84 · self-reporting</span></div>'+
    (vm.loadavg != null ? meter('CPU', Math.min(vm.loadavg/(vm.cores||1)*100,100), vm.loadavg.toFixed(2)+' LOAD / '+vm.cores+' CORES') : '')+
    (vm.memUsedMb != null ? meter('MEM', vm.memUsedMb/vm.memTotMb*100, (vm.memUsedMb/1024).toFixed(1)+' / '+(vm.memTotMb/1024).toFixed(1)+' GB') : '')+
    (vm.diskUsedGb != null ? meter('DISK', vm.diskUsedGb/vm.diskTotGb*100, vm.diskUsedGb+' / '+vm.diskTotGb+' GB') : '')+
    '<div class="svcgrid">'+chips.join('')+'</div>'+
    '<div class="nfoot">UP '+fmtUp(vm.uptime)+(g100 ? ' · PVE VIEW: CPU '+(g100.cpu*100).toFixed(0)+'% · '+g100.status.toUpperCase() : '')+'</div>'+
    '</div>');

  // ── defined systems ──
  (S.systems || []).forEach(sys => {
    const g = sys.vmid != null ? byVmid[sys.vmid] : null;
    const up = sys.up === true ? true : sys.up === false ? false : null;
    let foot = [];
    if (sys.ms != null) foot.push((sys.check || 'CHECK').toUpperCase() + ' ' + sys.ms + ' MS');
    if (up === false) foot = ['NOT RESPONDING — ' + (sys.check || '').toUpperCase() + ' FAILED'];
    if (g) foot.push(g.status.toUpperCase() + ' · UP ' + fmtUp(g.uptime));
    cards.push('<div class="node">'+
      '<div class="nhead">'+led(up)+'<span class="nm">'+sys.name+'</span>'+
      '<span class="role">'+(sys.role || '')+'</span></div>'+
      (g ? meter('CPU', g.cpu*100) + meter('MEM', g.mem*100) : '')+
      '<div class="nfoot">'+(foot.join(' · ') || 'NO CHECK DEFINED')+'</div>'+
      '</div>');
  });

  document.getElementById('rack').innerHTML = cards.join('');
}

function offline(msg){
  document.getElementById('stsNote').textContent = msg;
  document.getElementById('lnkSts').className = 'link dn';
}
async function poll(){
  try {
    const r = await fetch('status.json?_t=' + Date.now(), { cache:'no-store', signal: AbortSignal.timeout(8000) });
    if (!r.ok) { offline('STATUS FEED HTTP ' + r.status); return; }
    render(await r.json());
  } catch(e){ offline('STATUS FEED UNREACHABLE'); }
}
poll(); setInterval(poll, 15000);

// ── shows board (shows.json, pushed from the Mac by push-shows.command) ──
const PIPS=[['scaffolded','SCAF'],['packet_built','PKT'],['ses_built','SES'],['published','WIKI']];
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderShows(D){
  renderPending(D.pending);
  const today=new Date(D.today+'T12:00:00');
  const age=Math.round(Date.now()/1000-(D.generated||0));
  const n=document.getElementById('shNote');
  n.textContent=(D.shows||[]).length+' SHOWS · SYNCED '+(age<3600?Math.round(age/60)+'M':fmtUp(age))+' AGO'+(age>86400?' — STALE, RUN "REFRESH SHOWS BOARD" ON THE MAC':'');
  n.style.color=age>86400?'var(--warn)':'';
  let last='', rows=[];
  (D.shows||[]).forEach(s=>{
    const d=new Date(s.date+'T12:00:00'), days=Math.round((d-today)/864e5);
    const newDay=s.date!==last; last=s.date;
    const st=s.stages||{}, built=!!st.packet_built;
    const pips=PIPS.map(([k,l])=>{
      if(k==='ses_built'&&!s.needs_ses) return '<span class="pip na">'+l+'</span>';
      return '<span class="pip'+(st[k]?' on':'')+'">'+l+'</span>';
    }).join('');
    let flag='';
    if(days<0) flag='';
    else if(st.published) flag='<span class="o">READY</span>';
    else if(!built&&days<=2) flag='<span class="b">NOT BUILT</span>';
    else if(!built&&days<=7) flag='<span class="w">BUILD</span>';
    if(days>=0&&!s.plot&&!built) flag+=(flag?' · ':'')+'<span class="w">NO PLOT</span>';
    const when=days===0?'TODAY':days===1?'TMRW':days<0?Math.abs(days)+'D AGO':'IN '+days+'D';
    const dl=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
    rows.push('<tr class="'+(days<0?'past':'')+(newDay?' day':'')+'">'+
      '<td class="dt">'+(newDay?dl+'<small>'+when+'</small>':'')+'</td>'+
      '<td class="vn"><span class="tag '+s.venue+'">'+s.venue+'</span></td>'+
      '<td class="nm">'+(s.wiki?'<a href="'+esc(s.wiki)+'" target="_blank" rel="noopener">'+esc(s.show)+'</a>':esc(s.show))+'</td>'+
      '<td class="pl"><div class="pips">'+pips+'</div></td>'+
      '<td class="fl">'+flag+'</td></tr>');
  });
  document.getElementById('shows').innerHTML=rows.join('')||'<tr><td class="nm">No shows in window.</td></tr>';
}
async function pollShows(){
  try{
    const r=await fetch('shows.json?_t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!r.ok){document.getElementById('shNote').textContent='SHOWS FEED HTTP '+r.status;return;}
    renderShows(await r.json());
  }catch(e){document.getElementById('shNote').textContent='SHOWS FEED UNREACHABLE';}
}
pollShows(); setInterval(pollShows, 60000);

// ── band advance (advance.json, written every 30 s by status-writer from /internal/board) ──
const ADV='https://advance.tinydoorstudios.com';
const STCSS={queued:'queued',awaiting:'ready',ready_to_send:'ready',followup_due:'due',followup_drafted:'followup',
  responded:'responded',finalized:'finalized',held:'held',cancelled:'cancelled'};
const STLBL={queued:'Queued',awaiting:'Awaiting',ready_to_send:'Awaiting',followup_due:'Follow-up due',
  followup_drafted:'Follow-up sent',responded:'In progress',finalized:'Finalized',held:'On hold',cancelled:'Cancelled'};
const VTAG={'Fountain Square':'FSQ','Memorial Hall':'MEMO','Washington Park':'WP','Elm Street Plaza':'ESP'};
function renderAdv(D){
  const age=Math.round(Date.now()/1000-(D.generated||0));
  const n=document.getElementById('advNote');
  n.textContent=D.error?'ADVANCE APP: '+D.error:'LIVE · UPDATED '+(age<90?age+'S AGO':'STALE — '+fmtUp(age)+' OLD');
  n.style.color=(D.error||age>180)?'var(--bad)':'';
  const needs=D.needs||[];
  document.getElementById('advNeeds').innerHTML=needs.length?needs.map(x=>
    '<a class="need" href="'+ADV+esc(x.link_path||'/dashboard')+'" target="_blank" rel="noopener"><b>'+esc(x.label)+'</b><span>'+esc(x.detail||'')+'</span></a>').join('')
    :'<div class="need none"><b>Nothing waiting on you</b><span>All bookings matched, no doc changes to decide.</span></div>';
  const tally={}, rows=[];
  (D.bills||[]).forEach(b=>{
    const d=new Date(b.date+'T12:00:00');
    const dl=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
    const when=b.days_until===0?'TODAY':b.days_until===1?'TMRW':'IN '+b.days_until+'D';
    const acts=b.acts.map(a=>{ const k=a.state; const tk=k==='ready_to_send'?'awaiting':k; tally[tk]=(tally[tk]||0)+1;
      return '<div class="act"><span>'+esc(a.band)+'</span><span class="st '+(STCSS[k]||'queued')+'">'+(STLBL[k]||esc(k))+'</span></div>';}).join('');
    rows.push('<tr class="day"><td class="dt">'+dl+'<small>'+when+'</small></td>'+
      '<td class="vn"><span class="tag '+(VTAG[b.venue]||'')+'">'+(VTAG[b.venue]||esc(b.venue))+'</span></td>'+
      '<td class="nm">'+acts+'<div class="ser">'+esc(b.series||'')+(b.reviews?' · <span class="rv">'+b.reviews+' DOC CHANGE'+(b.reviews>1?'S':'')+'</span>':'')+'</div></td></tr>');
  });
  const order=['followup_due','held','responded','awaiting','followup_drafted','queued','finalized'];
  document.getElementById('advTally').innerHTML=order.filter(k=>tally[k]).map(k=>'<span class="st '+STCSS[k]+'">'+tally[k]+' '+STLBL[k]+'</span>').join('');
  document.getElementById('advBills').innerHTML=rows.join('')||'<tr><td class="nm">No upcoming bills.</td></tr>';
}
async function pollAdv(){
  try{
    const r=await fetch('advance.json?_t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!r.ok){document.getElementById('advNote').textContent='ADVANCE FEED HTTP '+r.status;return;}
    renderAdv(await r.json());
  }catch(e){document.getElementById('advNote').textContent='ADVANCE FEED UNREACHABLE';}
}
pollAdv(); setInterval(pollAdv, 30000);

// ── open issues: gear tickets (status.json → render) + PENDING.md (shows.json → renderShows) ──
const MONDAY='https://3cdc-cast.monday.com/boards/18405931866/pulses/';
const SEV={'Show-stopper':1,'Fix before next use':2,'Annoying but working':3,'Note for the record':4};
const VSHORT={'Fountain Square':'FSQ','Memorial Hall':'MEMO','Washington Park':'WP','Elm Street Plaza':'ESP'};
function renderTickets(T){
  const el=document.getElementById('tkList');
  if(T==null){el.innerHTML='<div class="hint">TICKET LEDGER UNREACHABLE</div>';return;}
  const t=[...T].sort((a,b)=>(SEV[a.severity]||5)-(SEV[b.severity]||5)||b.created_at.localeCompare(a.created_at));
  document.getElementById('tkHead').textContent='Gear tickets · '+t.length+' open';
  el.innerHTML=t.length?t.map(x=>{
    const days=Math.floor((Date.now()-Date.parse(x.created_at))/864e5);
    const title=String(x.title||'').replace(/^[^—]+—\s*/,'');
    const tag=x.monday_item_id?'a href="'+MONDAY+esc(x.monday_item_id)+'" target="_blank" rel="noopener"':'div';
    return '<'+tag+' class="tk s'+(SEV[x.severity]||4)+'"><span class="id">'+esc(x.ticket_id)+'</span>'+
      '<span class="bd">'+esc(title)+'<small>'+(VSHORT[x.venue]||esc(x.venue||''))+' · '+esc(x.severity||'')+'</small></span>'+
      '<span class="ag">'+(days<1?'today':days+'d')+'</span></'+(x.monday_item_id?'a':'div')+'>';
  }).join(''):'<div class="tk none"><span class="bd">No open tickets</span></div>';
}
function renderPending(P){
  const el=document.getElementById('pdList');
  if(P==null){el.innerHTML='<div class="hint">PENDING.md NOT READ</div>';return;}
  document.getElementById('pdHead').textContent='KB write-backs · '+P.length+' waiting';
  let sec='', out=[];
  P.forEach(x=>{
    if(x.section!==sec){sec=x.section;out.push('<div class="pdsec">'+esc(sec.replace(/^From\s+/,'').replace(/\s+—\s+queued.*$/,''))+'</div>');}
    out.push('<div class="pd'+(/^Reconc/.test(x.kind)?' rc':'')+'"><b>'+(/^Reconc/.test(x.kind)?'recon':'write')+'</b>'+esc(x.text)+'</div>');
  });
  el.innerHTML=P.length?out.join('')+'<div class="hint">WALKED WITH YOU AT THE TOP OF THE NEXT DEEP BUILD</div>'
    :'<div class="tk none"><span class="bd">Queue is clear</span></div>';
}
</script>
</body>
