map $arg_dl $kb_disp {
    default   inline;
    "1"       attachment;
}

server {
    listen 8088 default_server;
    server_name tinydoorstudios.com;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /rack/ {
        auth_basic "Tiny Door Studios";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /rack/index.html;
    }
    # 2026-09-27: rack action buttons. Behind the same basic-auth gate, POST
    # only, and only these three n8n run-now webhooks (all internal-only mail/DM).
    location ~ ^/rack/run/(daily-digest-now|crew-report-now|report-reminder-now)$ {
        auth_basic "Tiny Door Studios";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5678/webhook/$1;
        proxy_set_header Host n8n.tinydoorstudios.com;
        proxy_set_header Content-Type application/json;
        include /etc/nginx/run-token.conf;  # X-Advance-Token for n8n Check Token (secret, not in repo)
        proxy_read_timeout 60s;
    }
    location /cameras/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8088;
    server_name kb.tinydoorstudios.com;

    location /downloads/ {
        alias /kb-assets/;
        autoindex off;
        add_header Content-Disposition attachment;
        add_header Cache-Control "no-store, private, must-revalidate";
    }

        location /assets/ {
        alias /kb-assets/;
        autoindex off;
        add_header Content-Disposition $kb_disp always;
        add_header Cache-Control "no-store, private, must-revalidate";
    }

    location / {
        proxy_pass http://192.168.200.126:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 8088;
    server_name n8n.tinydoorstudios.com;

    auth_basic "Tiny Door Studios";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# tickets.tinydoorstudios.com
#
# Appended to /opt/landing/nginx.conf on the n8n VM — the `landing` nginx
# container runs host-network on :8088 and already name-vhosts
# tinydoorstudios.com, kb., and n8n. This is one more vhost on the same port.
#
# Deliberately NO auth_basic. The n8n vhost is password-protected; the crew
# scanning a QR code has no login and never will, so the form gets its own
# hostname with only the form paths exposed.
#
# Cloudflare tunnel: tickets.tinydoorstudios.com -> http://localhost:8088
# Routing is REMOTE-managed — change it through the Cloudflare API, never
# /etc/cloudflared/config.yml.

server {
    listen 8088;
    server_name tickets.tinydoorstudios.com;

    # Phone photos are big and there can be several per ticket.
    client_max_body_size 60m;

    # --- ticket photos, straight off disk ---
    location /p/ {
        alias /gear-photos/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # --- the form, and the endpoints it posts to ---
    # 2026-09-27: was ^/(form|webhook|webhook-test|webhook-waiting|rest|...) which
    # exposed EVERY n8n webhook (advance-lifecycle-now, internal-send-outlook, ...)
    # to the internet unauthenticated. Now only the gear-ticket form + its assets.
    location ~ ^/(form/gear-ticket(/|$)|form-waiting/|assets/|static/|icons/|types/|fonts/|favicon) {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- anything else goes to the form ---
    location = / {
        return 302 /form/gear-ticket;
    }

    location / {
        return 404;
    }
}
