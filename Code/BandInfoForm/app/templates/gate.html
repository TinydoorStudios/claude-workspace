<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advance — Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='advance.css') }}?v=1">
</head>
<body class="page-center">
<form class="card" method="post">
  <h1>Advance — Staff Access</h1>
  <p>Enter the passcode to search advance submissions.</p>
  <input type="password" name="passcode" placeholder="Passcode" autofocus>
  <button type="submit">Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
