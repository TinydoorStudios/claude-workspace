<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('thanks_title') }} — 3CDC Band Advance</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0;background:#0d1117;color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
  .box{max-width:560px;margin:14vh auto;background:#161b22;border:1px solid #2a323d;
    border-radius:12px;padding:40px 34px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.3);}
  h1{color:#4da3ff;font-size:22px;margin:0 0 10px;}
  p{font-size:15px;line-height:1.5;color:#8b97a6;margin:0;}
</style>
</head>
<body>
  <div class="box">
    <h1>{{ t('thanks_title') }}{% if band %}, {{ band }}{% endif %}</h1>
    <p>{{ t('thanks_body') }}</p>
  </div>
</body>
</html>
